<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Immigration Navigator — Execution Trace</title>
<style>
  :root {
    --bg: #f4f5f8;
    --panel: #ffffff;
    --border: #e4e7ec;
    --border-soft: #edeff3;
    --text: #14171f;
    --muted: #6b7280;
    --muted-soft: #9aa1af;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --active: #16a34a;
    --active-bg: #ecfdf3;
    --abstain: #dc2626;
    --abstain-bg: #fef2f2;
    --amber: #b45309;
    --amber-bg: #fffbeb;
    --idle-bg: #f6f7f9;
    --idle-text: #9aa1af;
    --code-bg: #f6f7f9;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
    --shadow-md: 0 4px 10px rgba(16, 24, 40, 0.06), 0 2px 4px rgba(16, 24, 40, 0.05);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f14;
      --panel: #15181f;
      --border: #262a35;
      --border-soft: #1d2029;
      --text: #eef0f4;
      --muted: #9198a8;
      --muted-soft: #6b7182;
      --accent: #818cf8;
      --accent-soft: #1e1f3a;
      --active: #4ade80;
      --active-bg: #0f2418;
      --abstain: #f87171;
      --abstain-bg: #2a1414;
      --amber: #fbbf24;
      --amber-bg: #2a2110;
      --idle-bg: #191c24;
      --idle-text: #565d6e;
      --code-bg: #1a1d26;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 26px 28px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header .inner { max-width: 1120px; margin: 0 auto; }
  header h1 {
    margin: 0 0 5px;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.5; max-width: 640px; }

  main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 70px; }

  .ask-row { display: flex; gap: 10px; margin-bottom: 12px; }
  #question {
    flex: 1;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14.5px;
    background: var(--panel);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #question:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #question::placeholder { color: var(--muted-soft); }
  #ask-btn {
    padding: 13px 24px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.05s ease;
    box-shadow: var(--shadow);
  }
  #ask-btn:hover:not(:disabled) { opacity: 0.92; }
  #ask-btn:active:not(:disabled) { transform: scale(0.98); }
  #ask-btn:disabled { opacity: 0.55; cursor: default; }

  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .example-btn {
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .example-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .example-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }

  #status {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--muted);
    font-size: 13.5px;
    margin-bottom: 18px;
    min-height: 20px;
  }
  #status.error { color: var(--abstain); }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .total-time {
    font-size: 12px;
    color: var(--muted-soft);
    margin-bottom: 14px;
  }
  .total-time strong { color: var(--text); font-weight: 600; }

  .graph {
    display: flex;
    align-items: flex-start;
    gap: 4px;
    overflow-x: auto;
    padding: 6px 4px 28px;
  }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 158px; }
  .arrow { color: var(--muted-soft); font-size: 18px; padding-top: 26px; flex-shrink: 0; }
  .node {
    position: relative;
    width: 100%;
    padding: 13px 12px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--idle-bg);
    color: var(--idle-text);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .node:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .node .step {
    position: absolute;
    top: -8px;
    left: -8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--panel);
    border: 1.5px solid var(--border);
    color: var(--muted-soft);
    font-size: 10.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .node .sub { display: block; font-weight: 400; font-size: 11px; margin-top: 3px; opacity: 0.85; }
  .node .time-badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 10.5px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(0,0,0,0.06);
  }
  .node.visited { background: var(--active-bg); border-color: var(--active); color: #14532d; }
  .node.visited .step { border-color: var(--active); color: var(--active); }
  @media (prefers-color-scheme: dark) { .node.visited { color: #86efac; } }
  .node.abstain-hit { background: var(--abstain-bg); border-color: var(--abstain); color: #7f1d1d; }
  .node.abstain-hit .step { border-color: var(--abstain); color: var(--abstain); }
  @media (prefers-color-scheme: dark) { .node.abstain-hit { color: #fca5a5; } }
  .node.selected { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md); border-color: var(--accent); }
  .branch-down { display: flex; flex-direction: column; align-items: center; gap: 3px; margin-top: 4px; }
  .branch-arrow { color: var(--muted-soft); font-size: 12px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 26px;
    margin-top: 10px;
    box-shadow: var(--shadow);
  }
  .panel h2 { margin: 0 0 16px; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .kv { display: grid; grid-template-columns: 175px 1fr; gap: 10px 14px; font-size: 13.5px; margin-bottom: 6px; }
  .kv .k { color: var(--muted); }
  .kv .v { word-break: break-word; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .badge.high { background: var(--active-bg); color: var(--active); }
  .badge.medium { background: var(--amber-bg); color: var(--amber); }
  .badge.low { background: var(--abstain-bg); color: var(--abstain); }
  .badge.bool-true { background: var(--active-bg); color: var(--active); }
  .badge.bool-false { background: var(--idle-bg); color: var(--muted); }

  .doc-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .doc-card {
    border: 1px solid var(--border-soft);
    background: var(--code-bg);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
  }
  .doc-card .title { font-weight: 600; margin-bottom: 3px; }
  .doc-card a { color: var(--accent); font-size: 12px; word-break: break-all; text-decoration: none; }
  .doc-card a:hover { text-decoration: underline; }
  .doc-card .meta { color: var(--muted); font-size: 11.5px; margin-top: 5px; }

  .claim {
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 11px 14px;
    margin-bottom: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .claim:hover { background: var(--code-bg); }
  .claim.supported { border-left: 3px solid var(--active); }
  .claim.unsupported { border-left: 3px solid var(--abstain); opacity: 0.7; }
  .claim .mark { display: inline-block; width: 16px; font-weight: 700; }
  .claim.supported .mark { color: var(--active); }
  .claim.unsupported .mark { color: var(--abstain); }
  .claim .quote {
    display: none;
    margin-top: 9px;
    padding: 9px 11px;
    background: var(--code-bg);
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.5;
  }
  .claim.open .quote { display: block; }

  .answer-text { font-size: 15.5px; line-height: 1.65; margin-bottom: 16px; }
  .callout {
    white-space: pre-wrap;
    font-size: 13px;
    line-height: 1.6;
    border-radius: 10px;
    padding: 13px 15px;
    margin-top: 10px;
    border-left: 3px solid var(--muted-soft);
    background: var(--code-bg);
  }
  .callout.info { border-left-color: var(--accent); background: var(--accent-soft); }
  .callout.warn { border-left-color: var(--amber); background: var(--amber-bg); }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted-soft);
    margin: 18px 0 8px;
  }

  .empty { color: var(--muted); font-size: 13.5px; padding: 60px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1>Immigration Navigator — Execution Trace</h1>
    <p>Every fork the pipeline can take is shown below. The path actually taken for your question is highlighted; click any node for the data behind it.</p>
  </div>
</header>

<main>
  <div class="ask-row">
    <input id="question" type="text" placeholder="Ask an F-1 student visa question…" />
    <button id="ask-btn">Ask</button>
  </div>
  <div class="examples">
    <button class="example-btn" data-q="Can I work while my OPT extension is pending?">Can I work while my OPT extension is pending?</button>
    <button class="example-btn" data-q="What happens to my F-1 status if my university closes down mid-semester?">University closes mid-semester (abstain example)</button>
    <button class="example-btn" data-q="How many days can I be absent from the US while on OPT?">How many days can I be absent while on OPT?</button>
  </div>
  <div id="status"></div>

  <div id="graph-wrap" style="display:none;">
    <div class="total-time" id="total-time"></div>
    <div class="graph" id="graph"></div>
    <div class="panel" id="detail-panel"></div>
  </div>

  <div class="empty" id="empty-state">Ask a question above to see it traced through the pipeline.</div>
</main>

<script>
const NODE_DEFS = [
  { id: "planner", label: "Planner", sub: "classify + schema-check", timingKey: "plan" },
  { id: "ground", label: "Ground", sub: "retrieve + assess", timingKey: "ground" },
  { id: "contradiction", label: "Contradiction Check", sub: "compare evidence", timingKey: "contradiction", abstainChild: "abstain_insufficient_retrieval", abstainLabel: "Abstain", abstainSub: "no source was sufficient" },
  { id: "verify", label: "Verify", sub: "faithfulness + scope", timingKey: "verify", abstainChild: "abstain_unresolved_contradiction", abstainLabel: "Abstain", abstainSub: "conflict unresolved" },
  { id: "final", label: "Build Answer", sub: "assemble Answer", abstainChild: "abstain_verification_wipeout", abstainLabel: "Abstain", abstainSub: "nothing survived verification" },
];

let lastData = null;
let selectedNode = null;

document.getElementById("ask-btn").addEventListener("click", () => ask());
document.getElementById("question").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
document.querySelectorAll(".example-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.getElementById("question").value = btn.dataset.q;
    document.querySelectorAll(".example-btn").forEach((b) => b.classList.toggle("active", b === btn));
    ask();
  });
});

async function ask() {
  const question = document.getElementById("question").value.trim();
  if (!question) return;

  const btn = document.getElementById("ask-btn");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.className = "";
  status.innerHTML = `<span class="spinner"></span> Running the pipeline (planner → ground → contradiction check → verify)…`;
  document.getElementById("empty-state").style.display = "none";

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: question }),
    });
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    lastData = await res.json();
    status.textContent = "";
    document.getElementById("graph-wrap").style.display = "block";
    const t = lastData.timings || {};
    document.getElementById("total-time").innerHTML = t.total !== undefined ? `Completed in <strong>${t.total.toFixed(1)}s</strong>` : "";
    renderGraph();
    selectNode(pickDefaultNode());
  } catch (err) {
    status.className = "error";
    status.textContent = `Error: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
}

function pickDefaultNode() {
  const a = lastData.answer;
  if (!a.abstained) return "final";
  if (a.abstain_reason === "insufficient_retrieval") return "abstain_insufficient_retrieval";
  if (a.abstain_reason === "unresolved_contradiction") return "abstain_unresolved_contradiction";
  return "abstain_verification_wipeout";
}

function visitedMainNodes() {
  const visited = new Set(["planner", "ground"]);
  if (lastData.contradiction !== null) visited.add("contradiction");
  if (lastData.verification !== null) visited.add("verify");
  if (!lastData.answer.abstained) visited.add("final");
  return visited;
}

function hitAbstainId() {
  const a = lastData.answer;
  if (!a.abstained) return null;
  return "abstain_" + a.abstain_reason;
}

function renderGraph() {
  const visited = visitedMainNodes();
  const abstainHit = hitAbstainId();
  const timings = lastData.timings || {};
  const graph = document.getElementById("graph");
  graph.innerHTML = "";

  NODE_DEFS.forEach((def, i) => {
    if (i > 0) {
      const arrow = document.createElement("div");
      arrow.className = "arrow";
      arrow.textContent = "→";
      graph.appendChild(arrow);
    }
    const col = document.createElement("div");
    col.className = "col";

    const node = document.createElement("div");
    node.className = "node" + (visited.has(def.id) ? " visited" : "");
    node.dataset.id = def.id;
    const time = def.timingKey && timings[def.timingKey] !== undefined ? `<span class="time-badge">${timings[def.timingKey].toFixed(1)}s</span>` : "";
    node.innerHTML = `<span class="step">${i + 1}</span>${def.label}<span class="sub">${def.sub}</span>${time}`;
    node.addEventListener("click", () => selectNode(def.id));
    col.appendChild(node);

    if (def.abstainChild) {
      const branch = document.createElement("div");
      branch.className = "branch-down";
      branch.innerHTML = `<span class="branch-arrow">↓ if not</span>`;
      const abstainNode = document.createElement("div");
      abstainNode.className = "node" + (abstainHit === def.abstainChild ? " abstain-hit" : "");
      abstainNode.dataset.id = def.abstainChild;
      abstainNode.innerHTML = `${def.abstainLabel}<span class="sub">${def.abstainSub}</span>`;
      abstainNode.addEventListener("click", () => selectNode(def.abstainChild));
      branch.appendChild(abstainNode);
      col.appendChild(branch);
    }

    graph.appendChild(col);
  });

  markSelected();
}

function selectNode(id) {
  selectedNode = id;
  markSelected();
  renderDetail(id);
}

function markSelected() {
  document.querySelectorAll(".node").forEach((el) => {
    el.classList.toggle("selected", el.dataset.id === selectedNode);
  });
}

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function badge(value) {
  return `<span class="badge ${value ? "bool-true" : "bool-false"}">${value ? "Yes" : "No"}</span>`;
}

function renderDocList(docs) {
  if (!docs || docs.length === 0) return "<p class='empty' style='padding:14px 0;'>No documents.</p>";
  return `<div class="doc-list">${docs.map((d) => `
    <div class="doc-card">
      <div class="title">${esc(d.title)}</div>
      <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.url)}</a>
      <div class="meta">${esc(d.source)} · ${esc(d.doc_type)} · tier ${esc(d.tier)} · updated ${esc(d.last_updated) || "unknown"}</div>
    </div>`).join("")}</div>`;
}

function renderDetail(id) {
  const panel = document.getElementById("detail-panel");
  const { plan, grounding, contradiction, verification, answer } = lastData;

  if (id === "planner") {
    panel.innerHTML = `<h2>Planner</h2>
      <div class="kv">
        <div class="k">Category</div><div class="v">${esc(plan.category)}</div>
        <div class="k">Missing fields</div><div class="v">${plan.missing_fields.length ? esc(plan.missing_fields.join(", ")) : "(none)"}</div>
        <div class="k">Needs document</div><div class="v">${badge(plan.needs_document)}</div>
        <div class="k">Needs clarification</div><div class="v">${esc(plan.needs_clarification) || "(none)"}</div>
        <div class="k">Preferred retrieval</div><div class="v">${esc(plan.preferred_retrieval)}</div>
      </div>`;
  } else if (id === "ground") {
    panel.innerHTML = `<h2>Grounding Loop</h2>
      <div class="kv">
        <div class="k">Sufficient</div><div class="v">${badge(grounding.sufficient)}</div>
        <div class="k">Rounds used</div><div class="v">${esc(grounding.rounds_used)}</div>
      </div>
      <div class="section-label">Retrieved documents</div>
      ${renderDocList(grounding.documents)}
      ${grounding.draft_answer ? `<div class="section-label">Draft answer (pre-verification)</div><div class="answer-text" style="font-size:13.5px;">${esc(grounding.draft_answer)}</div>` : ""}`;
  } else if (id === "contradiction") {
    if (!contradiction) {
      panel.innerHTML = `<h2>Contradiction Check</h2><p class="empty">Not reached — grounding was insufficient.</p>`;
      return;
    }
    panel.innerHTML = `<h2>Contradiction Finder</h2>
      <div class="kv">
        <div class="k">Conflict found</div><div class="v">${badge(contradiction.conflict_found)}</div>
        <div class="k">Resolved</div><div class="v">${badge(contradiction.resolved)}</div>
        <div class="k">Winning source</div><div class="v">${contradiction.winning_document ? esc(contradiction.winning_document.title) : "(none picked)"}</div>
        <div class="k">Rationale</div><div class="v">${esc(contradiction.rationale)}</div>
      </div>
      ${contradiction.supporting_quotes.length ? `<div class="section-label">Supporting quotes</div>${contradiction.supporting_quotes.map((q) => `<div class="doc-card" style="margin-bottom:8px;"><div class="meta">${esc(q.url)}</div>"${esc(q.quote)}"</div>`).join("")}` : ""}
      <div class="section-label">All documents compared</div>
      ${renderDocList(contradiction.all_documents)}`;
  } else if (id === "verify") {
    if (!verification) {
      panel.innerHTML = `<h2>Verifier</h2><p class="empty">Not reached — the contradiction wasn't resolved.</p>`;
      return;
    }
    panel.innerHTML = `<h2>Verifier</h2>
      <div class="kv">
        <div class="k">Grounding rate</div><div class="v">${(verification.grounding_rate * 100).toFixed(0)}%</div>
        <div class="k">Scope gate passes</div><div class="v">${badge(verification.scope.passes)}</div>
      </div>
      ${verification.scope.explanation ? `<div class="section-label">Scope gate explanation</div><div class="v">${esc(verification.scope.explanation)}</div>` : ""}
      <div class="section-label">Claims (click to see evidence)</div>
      ${verification.claims.map((c) => `
        <div class="claim ${c.supported ? "supported" : "unsupported"}" onclick="this.classList.toggle('open')">
          <span class="mark">${c.supported ? "✓" : "✗"}</span>${esc(c.claim)}
          ${c.quote ? `<div class="quote">"${esc(c.quote)}"<br><span style="opacity:0.7;">— ${esc(c.source_url)}</span></div>` : ""}
        </div>`).join("")}`;
  } else if (id === "final") {
    panel.innerHTML = renderAnswer(answer);
  } else if (id.startsWith("abstain_")) {
    panel.innerHTML = renderAnswer(answer);
  }
}

function renderAnswer(answer) {
  if (answer.abstained) {
    return `<h2>Abstained — ${esc(answer.abstain_reason)}</h2>
      <div class="callout warn">${esc(answer.human_follow_up)}</div>
      ${answer.document_request ? `<div class="section-label">Document request</div><div class="callout info">${esc(answer.document_request)}</div>` : ""}`;
  }
  const confClass = (answer.confidence || "").toLowerCase();
  return `<h2>Answer <span class="badge ${confClass}">${esc(answer.confidence)} confidence</span></h2>
    <div class="answer-text">${esc(answer.answer)}</div>
    <div class="kv">
      <div class="k">Source</div><div class="v">${answer.source ? `<a href="${esc(answer.source.url)}" target="_blank">${esc(answer.source.title)}</a>` : "—"}</div>
      ${answer.source_rationale ? `<div class="k">Source rationale</div><div class="v">${esc(answer.source_rationale)}</div>` : ""}
      <div class="k">Last updated</div><div class="v">${esc(answer.last_updated) || "unknown"}</div>
      <div class="k">Missing information</div><div class="v">${answer.missing_information.length ? esc(answer.missing_information.join(", ")) : "(none)"}</div>
    </div>
    ${answer.document_request ? `<div class="section-label">Document request</div><div class="callout info">${esc(answer.document_request)}</div>` : ""}
    <div class="section-label">Route for your specific situation</div>
    <div class="callout warn">${esc(answer.human_follow_up)}</div>`;
}
</script>

</body>
</html>
