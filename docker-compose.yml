services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: immigration_navigator
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: immigration_navigator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
